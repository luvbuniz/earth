name: Deploy to GitHub Pages

# Publishes the site by mirroring this branch to `gh-pages`, which GitHub
# Pages serves directly. This works with the default workflow token —
# no admin permissions or manual Pages setup required.

on:
  push:
    branches:
      - main
      - claude/3d-earth-digital-twin-b7trtc
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish this commit to the gh-pages branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          touch .nojekyll
          git add .nojekyll
          git commit -m "Deploy ${GITHUB_SHA::9} to GitHub Pages"
          git push --force origin HEAD:gh-pages
